name: Versione web di prova

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"     # ogni mattina: prezzi del giorno per il portafoglio
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Costruisci la pagina
        run: bash web/build.sh _site
      - name: Scarica i prezzi
        run: python web/prezzi.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
